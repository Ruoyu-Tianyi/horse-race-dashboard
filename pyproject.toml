[project]
name = "race-edge"
version = "0.1.0"
description = "Historical Hong Kong horse-racing predictions and odds comparison dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.50,<2",
    "pandas>=2.3,<4",
    "numpy>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "plotly>=6,<7",
]

[dependency-groups]
dev = ["matplotlib>=3.10,<4", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "nbconvert>=7,<8"]

